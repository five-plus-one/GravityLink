<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/assets/landing/gravitylink-landing.css">
</head>
<body>
  <main class="landing-page landing-public">
    <svg class="landing-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 15l6-6M9.5 7.5l2-2a5 5 0 017 7l-2 2M14.5 16.5l-2 2a5 5 0 01-7-7l2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>{{.Title}}</h1>
    <p>{{.Message}}</p>
    {{if .StatusText}}<div class="landing-status">{{.StatusText}}</div>{{end}}
    <footer class="landing-footer">
      {{.Footer}}
      <div class="gravitylink-footer">
        <a href="https://github.com/five-plus-one/GravityLink" target="_blank" rel="noopener noreferrer">Powered by GravityLink</a>
      </div>
      {{if or .ICP .PoliceICP}}
      <div class="landing-beian">
        {{if .ICP}}<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{.ICP}}</a>{{end}}
        {{if .PoliceICP}}<a href="https://beian.mps.gov.cn/" target="_blank" rel="noopener noreferrer">{{.PoliceICP}}</a>{{end}}
      </div>
      {{end}}
    </footer>
  </main>
  <style>
    .landing-beian { margin-top: 8px; font-size: 12px; }
    .landing-beian a { color: var(--color-text-tertiary, #7a8990); text-decoration: none; margin: 0 6px; }
    .landing-beian a:hover { color: var(--color-primary, #0f766e); }
  </style>
</body>
</html>
