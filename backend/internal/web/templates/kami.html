<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/assets/landing/gravitylink-landing.css">
  <style>
    :root{--color-primary:{{.ThemeColor}}}
    .kami-result{margin:16px 0 0;padding:16px;background:var(--color-bg-page);border:1px solid var(--color-border);border-radius:8px;word-break:break-all;font-family:'SFMono-Regular',Consolas,monospace;font-size:15px;line-height:1.6;user-select:all;-webkit-user-select:all}
    .kami-error{margin-top:12px;color:#dc2626;font-size:14px}
    .kami-copy{margin-top:12px;width:100%}
    .kami-pwd{margin:0 0 16px;text-align:left}
    .kami-pwd label{display:block;font-size:13px;color:var(--color-text-secondary);margin-bottom:6px}
    .kami-pwd input{width:100%;padding:10px 12px;border:1px solid var(--color-border);border-radius:6px;font-size:15px;box-sizing:border-box}
  </style>
</head>
<body>
  <main class="landing-page">
    <h1>{{.Title}}</h1>
    <p>{{.Announcement}}</p>
    {{if .Preview}}
    <div style="display:grid;place-items:center;min-height:120px;border:2px dashed #cbd5e1;color:#64748b;background:#f8fafc;border-radius:8px;margin-bottom:16px">卡密提取区（预览：请先绑定卡密项目）</div>
    {{else}}
    <div class="kami-pwd" data-kami-password-wrap hidden>
      <label for="kami-password">提取口令</label>
      <input id="kami-password" type="text" autocomplete="off" placeholder="请输入提取口令">
    </div>
    <button type="button" class="landing-button" style="width:100%" data-kami-issue data-project-id="{{.ProjectID}}">{{.ButtonText}}</button>
    <div class="kami-error" data-kami-error hidden></div>
    <div class="kami-result" data-kami-result hidden></div>
    <button type="button" class="landing-button kami-copy" data-kami-copy hidden>复制卡密</button>
    {{end}}
  </main>
  <script src="/assets/landing/gravitylink-landing.js"></script>
<div class="gravitylink-footer"><a href="https://github.com/five-plus-one/GravityLink" target="_blank" rel="noopener noreferrer">Powered by GravityLink</a></div></body>
</html>
