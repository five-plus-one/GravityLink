<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/assets/landing/gravitylink-landing.css">
  <style>
    :root{--color-primary:{{.ThemeColor}}}
    .kf-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:12px}
    .kf-badge.online{background:#dcfce7;color:#15803d}
    .kf-badge.offline{background:#f1f5f9;color:#64748b}
    .kf-badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
    .kf-badge.online i{background:#22c55e}
    .kf-badge.offline i{background:#94a3b8}
    .kf-qr{display:block;width:min(80vw,320px);height:auto;margin:8px auto 16px;border-radius:10px;border:1px solid var(--color-border)}
    .kf-wx{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 8px;padding:12px 16px;background:var(--color-bg-page);border:1px solid var(--color-border);border-radius:8px;font-size:15px;font-weight:600;font-family:'SFMono-Regular',Consolas,monospace}
    .kf-copy{border:0;background:var(--color-primary);color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
    .kf-copy:active{transform:translateY(1px)}
    .kf-copy.done{background:#16a34a}
    .kf-tip{margin-top:16px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;color:#92400e;font-size:12px;line-height:1.6;text-align:left}
  </style>
</head>
<body>
  <main class="landing-page">
    <span class="kf-badge {{if .Online}}online{{else}}offline{{end}}">
      <i></i>{{if .Online}}当前在线{{else}}可能回复较慢{{end}}
    </span>
    <h1>{{.Headline}}</h1>
    <p>{{.Subtext}}</p>
    {{if .Preview}}
    <div class="kf-qr" style="display:grid;place-items:center;min-height:220px;border:2px dashed #cbd5e1;color:#64748b;background:#f8fafc">客服二维码展示区域</div>
    {{else if .IsImage}}
    <img class="kf-qr" data-liveqr-image src="{{.TargetURL}}" alt="客服二维码">
    <p data-liveqr-error role="alert" hidden>二维码图片加载失败，请联系管理员检查图片地址或重新上传二维码。</p>
    {{else}}
    <a class="landing-button" href="{{.TargetURL}}">打开目标</a>
    {{end}}
    {{if .WxRemark}}
    <div class="kf-wx">
      <span>微信号：{{.WxRemark}}</span>
      <button type="button" class="kf-copy" data-copy-wx="{{.WxRemark}}">复制</button>
    </div>
    {{end}}
    {{if .SafetyTip}}
    <div class="kf-tip">{{.SafetyTip}}</div>
    {{end}}
    <footer class="landing-footer">{{.FooterText}}</footer>
  </main>
  <script src="/assets/landing/gravitylink-landing.js"></script>
</body>
</html>
