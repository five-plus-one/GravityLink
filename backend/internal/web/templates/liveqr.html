<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/assets/landing/gravitylink-landing.css">
  <style>:root{--color-primary:{{.ThemeColor}}}</style>
</head>
<body>
  <main class="landing-page">
    {{if .ShowLogo}}
    <img class="landing-logo" src="{{.LogoURL}}" alt="{{.Headline}}">
    {{end}}
    <h1>{{.Headline}}</h1>
    {{if .Subtext}}<p>{{.Subtext}}</p>{{end}}
    {{if .Preview}}
    <div class="landing-qr" style="display:grid;place-items:center;min-height:220px;border:2px dashed #cbd5e1;color:#64748b;background:#f8fafc">群二维码展示区域</div>
    {{else if .IsImage}}
    <img class="landing-qr" data-liveqr-image src="{{.TargetURL}}" alt="群二维码">
    <p data-liveqr-error role="alert" hidden>二维码图片加载失败，请联系管理员检查图片地址或重新上传二维码。</p>
    {{else}}
    <a class="landing-button" href="{{.TargetURL}}">{{.ButtonText}}</a>
    {{end}}
    <footer class="landing-footer">{{.FooterText}}</footer>
  </main>
  <script src="/assets/landing/gravitylink-landing.js"></script>
<div class="gravitylink-footer"><a href="https://github.com/five-plus-one/GravityLink" target="_blank" rel="noopener noreferrer">Powered by GravityLink</a></div></body>
</html>
