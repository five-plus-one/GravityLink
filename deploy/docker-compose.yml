name: gravitylink

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gravitylink_root}
      MYSQL_DATABASE: gravitylink
      MYSQL_USER: gravitylink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ugravitylink -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gravitylink:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      ADMIN_HTTP_ADDR: :8081
      CONFIG_FILE: /data/gravitylink.json
      SETUP_DEFAULT_MYSQL_HOST: mysql
      SETUP_DEFAULT_REDIS_HOST: redis
      TZ: Asia/Shanghai
      # 镜像内已内置 IP 库；如需自定义可改回卷内路径并挂载 xdb
      GEO_DB_PATH: /app/ip2region.xdb
    ports:
      - "${APP_PORT:-18080}:8080"
      - "${ADMIN_PORT:-18081}:8081"
    volumes:
      - gravitylink_data:/data
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  gravitylink_data:
